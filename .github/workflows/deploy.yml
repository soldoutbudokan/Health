name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish without pushing an empty commit.
  workflow_dispatch:

# GITHUB_TOKEN needs to write Pages and mint the OIDC token deploy-pages uses.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queued runs are not cancelled — a half-finished
# publish is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/configure-pages@v5

      - run: npm run build

      # Pages runs the artifact through Jekyll unless told not to, and Jekyll
      # drops any path beginning with an underscore — which is every Next.js
      # asset under _next.
      - name: Disable Jekyll
        run: touch ./out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
