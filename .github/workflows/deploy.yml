name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish without pushing an empty commit.
  workflow_dispatch:

# GITHUB_TOKEN needs to write Pages and mint the OIDC token deploy-pages uses.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queued runs are not cancelled — a half-finished
# publish is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/configure-pages@v5

      - run: npm run build

      # Pages runs the artifact through Jekyll unless told not to, and Jekyll
      # drops any path beginning with an underscore — which is every Next.js
      # asset under _next.
      - name: Disable Jekyll
        run: touch ./out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      # A publish can fail with a perfectly good build behind it — Pages spent
      # the afternoon of August 6, 2026 doing exactly that, and the log sat
      # correct on main with no way to look at it. The snapshot rides along on
      # every run, so a red deploy still leaves one downloadable file that
      # opens offline. It is not part of the Pages artifact: it lives at the
      # repo root, not in out/, and the site has no need of a copy of itself.
      - name: Build the offline snapshot
        run: node scripts/snapshot.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: snapshot.html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Don't try to raise the timeout here. On August 6, 2026 three runs in a
      # row aborted at ten minutes while Pages was degraded — one stuck in
      # deployment_queued, two killed part-way through deployment_in_progress,
      # each one cancelling a publish that was otherwise working. Passing
      # `timeout: 1800000` looks like the fix and isn't: the action clamps it
      # and logs "timeout value is greater than the allowed maximum - timeout
      # set to the maximum of 600000 milliseconds". Ten minutes is a hard
      # ceiling in deploy-pages, so a slow Pages day cannot be waited out from
      # this file. If the build job passed and this one didn't, nothing in the
      # repo is broken — re-run the workflow once Pages recovers.
      - id: deployment
        uses: actions/deploy-pages@v4
